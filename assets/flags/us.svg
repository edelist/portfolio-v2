<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 10" width="15" height="10">
  <!-- 7 stripes instead of 13: at 15px wide, 13 stripes are sub-pixel mush -->
  <rect width="15" height="10" fill="#ffffff"/>
  <g fill="#b22234">
    <rect y="0" width="15" height="1.429"/>
    <rect y="2.857" width="15" height="1.429"/>
    <rect y="5.714" width="15" height="1.429"/>
    <rect y="8.571" width="15" height="1.429"/>
  </g>
  <rect width="6" height="5.714" fill="#3c3b6e"/>
  <g fill="#ffffff">
    <circle cx="1.5" cy="1.4" r=".3"/><circle cx="3" cy="1.4" r=".3"/><circle cx="4.5" cy="1.4" r=".3"/>
    <circle cx="2.25" cy="2.85" r=".3"/><circle cx="3.75" cy="2.85" r=".3"/>
    <circle cx="1.5" cy="4.3" r=".3"/><circle cx="3" cy="4.3" r=".3"/><circle cx="4.5" cy="4.3" r=".3"/>
  </g>
</svg>

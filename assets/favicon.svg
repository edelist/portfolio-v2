<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ~/jack — the shell prompt from the status bar, as an app tile.
       Geometry matches the raster set in assets/ (generated at 8x and
       downsampled); if you change one, change both. Accent is --accent
       from the dark theme, which holds up against light and dark browser
       chrome alike; the glyph is --bg. -->
